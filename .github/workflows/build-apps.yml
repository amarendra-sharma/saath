# Builds the iPhone and Android apps in Expo's cloud (EAS). No Terminal needed:
# GitHub → Actions → "Build Saath apps" → Run workflow.
# One-time setup: add repository secret EXPO_TOKEN (expo.dev → Account settings → Access tokens).
name: Build Saath apps
on:
  workflow_dispatch:
    inputs:
      platform:
        description: "android, ios or all"
        default: "android"
        required: true
      profile:
        description: "preview (test install) or production (store)"
        default: "preview"
        required: true
      submit:
        description: "Also submit to the stores (production only)"
        default: "false"
        required: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: expo/expo-github-action@v8
        with: { eas-version: latest, token: "${{ secrets.EXPO_TOKEN }}" }
      - run: npm ci
      - name: Link to Expo project (first run creates it)
        run: eas init --non-interactive --force || true
      - name: Build
        run: >
          eas build --platform ${{ inputs.platform }} --profile ${{ inputs.profile }}
          --non-interactive --no-wait
          ${{ inputs.submit == 'true' && inputs.profile == 'production' && '--auto-submit' || '' }}
