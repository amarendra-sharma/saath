<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bengu user guide</title>
<meta name="description" content="How to use Bengu: circles, shares, bills, paying your share, the money trail, Bill Check, reminders, insights, agreements and Bengu Plus.">
<meta name="theme-color" content="#1A3A6E">
<link rel="icon" href="/img/bengu-icon-64.png">
<!--
  THIS FILE IS GENERATED by guide/build.py from guide/body.<lang>.html (en, hi, bn, ne, es, fr, pt).
  Edit the body files, then run: python3 guide/build.py public
  KEEP THIS GUIDE CURRENT, IN EVERY LANGUAGE. Whenever a Bengu feature changes:
   1. update the section(s) below that describe it (each <section id> matches a screen or feature);
   2. add a line at the top of "What's new" (newest first) and bump GUIDE_UPDATED;
   3. if a screen gets a new name or button label, use the exact words the app shows.
  The in-app link (Profile → How to use Bengu) opens /guide.<lang>.html (English: /guide.html), optionally with
  #<section id>, so keep the ids identical in every language.
-->
<style>
  :root { --bg:#F4F6FA; --card:#FFFFFF; --ink:#0E1A2B; --ink2:#44526A; --ink3:#63708A; --line:#E2E7EF;
          --navy:#1A3A6E; --navy2:#112850; --soft:#E8EEF8; --gold:#C99A3E; --gold2:#8F6316; --goldsoft:#F8EFDD; --ok:#0E7A48; --oksoft:#E3F4EA; --owe:#B42318; }
  * { box-sizing:border-box; }
  html { scroll-behavior:smooth; scroll-padding-top:76px; }
  @media (prefers-reduced-motion: reduce) { html { scroll-behavior:auto; } }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans","Noto Sans Devanagari",sans-serif; }
  a { color:var(--navy); }
  :focus-visible { outline:3px solid var(--gold); outline-offset:2px; }
  .skip { position:absolute; left:-999px; top:8px; background:#fff; padding:8px 12px; border-radius:8px; z-index:10; }
  .skip:focus { left:8px; }
  nav.top { position:sticky; top:0; z-index:5; background:rgba(244,246,250,.94); backdrop-filter:saturate(1.4) blur(8px); border-bottom:1px solid var(--line); }
  nav.top .wrap { max-width:1180px; margin:0 auto; padding:0 20px; display:flex; align-items:center; gap:16px; height:62px; }
  .brand { display:flex; align-items:center; gap:10px; font-weight:800; font-size:19px; color:var(--ink); text-decoration:none; }
  .brand img { width:30px; height:30px; border-radius:8px; }
  nav.top .links { margin-left:auto; display:flex; gap:16px; align-items:center; }
  nav.top .links a { color:var(--ink2); text-decoration:none; font-weight:600; font-size:15px; }
  .btn { display:inline-flex; align-items:center; padding:9px 14px; border-radius:10px; font-weight:700; text-decoration:none; font-size:14px; background:var(--navy); color:#fff !important; }

  .layout { max-width:1180px; margin:0 auto; padding:24px 20px 80px; display:grid; grid-template-columns:250px 1fr; gap:32px; }
  aside.toc { position:sticky; top:82px; align-self:start; max-height:calc(100vh - 100px); overflow:auto; font-size:14.5px; }
  aside.toc .t { font-weight:800; color:var(--ink3); text-transform:uppercase; letter-spacing:.5px; font-size:12px; margin:0 0 8px; }
  aside.toc ol { list-style:none; margin:0; padding:0; }
  aside.toc a { display:block; padding:5px 10px; border-radius:8px; color:var(--ink2); text-decoration:none; }
  aside.toc a:hover, aside.toc a.on { background:var(--soft); color:var(--navy); font-weight:600; }
  @media (max-width:880px) { .layout { grid-template-columns:1fr; } aside.toc { position:static; max-height:none; } aside.toc ol { columns:2; } }

  .intro { background:linear-gradient(160deg,var(--navy2),var(--navy)); color:#fff; border-radius:20px; padding:28px; }
  .intro h1 { margin:0 0 6px; font-size:32px; letter-spacing:-.5px; }
  .intro p { margin:0; color:rgba(255,255,255,.88); }
  .intro .meta { margin-top:12px; font-size:13px; color:rgba(255,255,255,.7); }
  .search { margin:18px 0 0; }
  .search input { width:100%; padding:12px 14px; border-radius:12px; border:1px solid var(--line); font-size:16px; background:#fff; }
  main section { background:var(--card); border:1px solid var(--line); border-radius:18px; padding:22px 24px; margin:18px 0; }
  main section.hidden { display:none; }
  h2 { margin:0 0 10px; font-size:23px; letter-spacing:-.3px; }
  h2 .n { color:var(--gold2); font-weight:800; margin-right:6px; }
  h3 { margin:20px 0 6px; font-size:17px; }
  p, li { color:var(--ink2); }
  strong { color:var(--ink); }
  ol.steps { padding-left:22px; }
  ol.steps li { margin:6px 0; }
  .ui { background:var(--soft); color:var(--navy); font-weight:700; padding:1px 7px; border-radius:6px; white-space:nowrap; font-size:.94em; }
  .tip, .note, .warn { border-radius:12px; padding:12px 14px; margin:14px 0; font-size:15px; }
  .tip { background:var(--oksoft); color:#0B4D2E; }
  .note { background:var(--soft); color:var(--navy2); }
  .warn { background:var(--goldsoft); color:#5C3F08; }
  .tip b, .note b, .warn b { color:inherit; }
  table { width:100%; border-collapse:collapse; font-size:15px; margin:10px 0; }
  th, td { text-align:left; padding:8px 8px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { color:var(--ink); background:var(--bg); }
  .new { list-style:none; padding:0; margin:0; }
  .new li { padding:8px 0; border-bottom:1px solid var(--line); }
  .new li:last-child { border-bottom:0; }
  .new time { font-weight:700; color:var(--ink); margin-right:6px; }
  footer { max-width:1180px; margin:0 auto; padding:0 20px 50px; color:var(--ink3); font-size:14px; }
  footer a { color:var(--ink2); font-weight:600; margin-right:18px; text-decoration:none; }
  @media print { nav.top, aside.toc, .search, footer { display:none; } .layout { display:block; } main section { break-inside:avoid; border:0; } }
</style>
</head>
